<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retailer Management - Rajkumar Rationcard Services</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Gujarati", sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: 0.95;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #0d47a1;
      text-align: center;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      margin-bottom: 7px;
    }

    label span {
      color: red;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 2px rgba(25,118,210,0.10);
    }

    /* EMAIL EMPTY / INVALID */
    input.email-error {
      border: 2px solid red !important;
      background: #fff5f5;
    }

    .error-text {
      color: red;
      font-size: 13px;
      margin-top: 5px;
      display: none;
    }

    .error-text.show {
      display: block;
    }

    .button-area {
      margin-top: 25px;
      text-align: center;
    }

    button {
      border: none;
      padding: 13px 28px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .create-btn {
      background: #0d47a1;
      color: white;
      min-width: 220px;
    }

    .create-btn:hover {
      background: #083b87;
    }

    .create-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 9px;
      font-weight: bold;
      white-space: pre-line;
    }

    .message.success {
      display: block;
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #81c784;
    }

    .message.error {
      display: block;
      background: #ffebee;
      color: #b71c1c;
      border: 1px solid #ef9a9a;
    }

    .info-box {
      margin-top: 20px;
      padding: 14px;
      background: #fff8e1;
      border-left: 5px solid #ffb300;
      border-radius: 7px;
      font-size: 14px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background: #555;
      color: white;
      padding: 10px 18px;
      border-radius: 7px;
    }

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .card {
        padding: 18px;
      }

      .header h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>RAJKUMAR RATIONCARD SERVICES</h1>
    <p>Retailer Management</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>➕ Create Retailer Account</h2>

      <form id="retailerForm" novalidate>

        <div class="form-grid">

          <!-- RETAILER NAME -->
          <div class="form-group full">
            <label>
              Retailer Name <span>*</span>
            </label>

            <input
              type="text"
              id="retailerName"
              name="retailerName"
              placeholder="Enter retailer name"
              autocomplete="off"
              required
            >
          </div>


          <!-- MOBILE -->
          <div class="form-group">
            <label>
              Mobile Number <span>*</span>
            </label>

            <input
              type="tel"
              id="mobile"
              name="mobile"
              placeholder="Enter mobile number"
              maxlength="10"
              inputmode="numeric"
              autocomplete="off"
              required
            >
          </div>


          <!-- EMAIL -->
          <div class="form-group">

            <label>
              Email Address <span>*</span>
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter retailer email"
              autocomplete="off"
              required
            >

            <div
              id="emailError"
              class="error-text"
            >
              Email address ફરજિયાત છે.
            </div>

          </div>


          <!-- USERNAME -->
          <div class="form-group">

            <label>
              Username <span>*</span>
            </label>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Create username"
              autocomplete="off"
              required
            >

          </div>


          <!-- PASSWORD -->
          <div class="form-group">

            <label>
              Password <span>*</span>
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create password"
              autocomplete="new-password"
              required
            >

          </div>

        </div>


        <div class="info-box">
          📧 Retailer create થયા પછી <b>Retailer ID, Username અને Password</b>
          આપેલા Email Address પર મોકલવામાં આવશે.
        </div>


        <div class="button-area">

          <button
            type="submit"
            id="createBtn"
            class="create-btn"
          >
            ➕ CREATE RETAILER
          </button>

        </div>

      </form>


      <div
        id="message"
        class="message"
      ></div>


      <div style="text-align:center;">
        <a
          href="index.html"
          class="back-btn"
        >
          ← Back
        </a>
      </div>

    </div>

  </div>


  <script src="retailer.js"></script>

</body>
</html>
