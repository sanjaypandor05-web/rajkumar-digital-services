<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retailer Login - Rajkumar Rationcard Services</title>

  <link rel="stylesheet" href="retailer.css">
</head>

<body>

  <div class="page">

    <div class="login-card">

      <div class="logo">
        👤
      </div>

      <h1>Retailer Login</h1>

      <p class="subtitle">
        RAJKUMAR RATIONCARD SERVICES
      </p>

      <div id="message" class="message"></div>

      <form id="retailerLoginForm">

        <div class="form-group">

          <label for="username">
            Retailer ID / Username
          </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter Retailer ID or Username"
            autocomplete="off"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-box">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter Password"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
            >
              👁
            </button>

          </div>

        </div>


        <button
          type="submit"
          id="loginBtn"
          class="login-btn"
        >
          LOGIN
        </button>

      </form>


      <div class="bottom-area">

        <a href="index.html" class="back-link">
          ← Back to Home
        </a>

      </div>

    </div>

  </div>


  <script src="retailer.js"></script>

</body>
</html>
