<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retailer Management - Rajkumar Rationcard Services</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      margin-bottom: 7px;
      color: #333;
    }

    .required {
      color: red;
      font-size: 18px;
      margin-left: 3px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2575fc;
      box-shadow: 0 0 0 2px rgba(37,117,252,0.12);
    }

    .btn {
      border: none;
      padding: 13px 22px;
      border-radius: 8px;
      background: #2575fc;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn:hover {
      background: #1557c0;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      white-space: pre-line;
    }

    .success {
      display: block;
      background: #e8f8ee;
      color: #16733b;
      border: 1px solid #b8e6c8;
    }

    .error {
      display: block;
      background: #ffecec;
      color: #b30000;
      border: 1px solid #ffb5b5;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f1f4f8;
    }

    .status-active {
      color: green;
      font-weight: bold;
    }

    @media (max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .card {
        padding: 18px;
      }

      .header h1 {
        font-size: 21px;
      }

    }
  </style>
</head>

<body>

  <div class="header">
    <h1>RAJKUMAR RATIONCARD SERVICES</h1>
    <p>Retailer Management</p>
  </div>

  <div class="container">

    <!-- CREATE RETAILER -->

    <div class="card">

      <h2>➕ Create Retailer</h2>

      <form id="retailerForm">

        <div class="form-grid">

          <div class="form-group">
            <label>
              Retailer Name
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="retailerName"
              name="retailerName"
              placeholder="Enter Retailer Name"
              required
            >
          </div>


          <div class="form-group">
            <label>
              Mobile Number
              <span class="required">*</span>
            </label>

            <input
              type="tel"
              id="mobile"
              name="mobile"
              placeholder="Enter Mobile Number"
              maxlength="10"
              required
            >
          </div>


          <!-- EMAIL -->

          <div class="form-group full">

            <label>
              Email
              <span class="required">*</span>
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter Retailer Email"
              autocomplete="off"
              required
            >

          </div>


          <div class="form-group">
            <label>
              Username
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter Username"
              autocomplete="off"
              required
            >
          </div>


          <div class="form-group">
            <label>
              Password
              <span class="required">*</span>
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter Password"
              autocomplete="new-password"
              required
            >
          </div>

        </div>


        <button
          type="submit"
          class="btn"
          id="createRetailerBtn"
        >
          Create Retailer
        </button>

      </form>


      <div
        id="message"
        class="message"
      ></div>

    </div>


    <!-- RETAILER LIST -->

    <div class="card">

      <h2>👥 Retailer List</h2>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>Retailer ID</th>
              <th>Name</th>
              <th>Mobile</th>
              <th>Email</th>
              <th>Username</th>
              <th>Status</th>
              <th>Total Applications</th>
            </tr>

          </thead>

          <tbody id="retailerTableBody">

            <tr>
              <td colspan="7">
                Loading...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


  <script src="retailer.js"></script>

</body>
</html>
