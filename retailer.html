<!DOCTYPE html>
<html lang="gu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Retailer Login - Rajkumar Rationcard Services</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="retailer.css">
</head>

<body>

<div class="retailer-page">

    <header class="retailer-topbar">
        <div class="retailer-brand">
            RAJKUMAR RATIONCARD SERVICES
        </div>

        <div class="retailer-phone">
            Retailer Portal
        </div>
    </header>

    <!-- LOGIN -->
    <section id="loginSection">

        <div class="login-wrapper">

            <div class="login-card">

                <div class="login-icon">👤</div>

                <h1>RETAILER LOGIN</h1>

                <p>Enter your Retailer ID and Password</p>

                <form id="retailerLoginForm" autocomplete="off">

                    <div class="form-group">

                        <label for="retailerId">
                            Retailer ID
                        </label>

                        <input
                            type="text"
                            id="retailerId"
                            name="retailerId"
                            placeholder="Enter Retailer ID"
                            autocomplete="off"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="retailerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="retailerPassword"
                            name="retailerPassword"
                            placeholder="Enter Password"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="login-button"
                        id="retailerLoginButton">

                        LOGIN

                    </button>

                    <div
                        id="loginMessage"
                        class="login-message"
                        style="display:none;">
                    </div>

                </form>

                <a
                    href="index.html"
                    class="back-home">

                    ← Back to Home

                </a>

            </div>

        </div>

    </section>

</div>

<script src="retailer.js"></script>

</body>
</html>
