<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retailer Login - Rajkumar Rationcard Services</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      background: #ffffff;
      padding: 18px 22px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand h1 {
      color: #1d4ed8;
      font-size: 24px;
    }

    .brand p {
      color: #64748b;
      margin-top: 5px;
    }

    .logout-btn {
      display: none;
      border: none;
      background: #dc2626;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .login-card {
      max-width: 450px;
      margin: 50px auto;
    }

    h2 {
      color: #1e293b;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn-green {
      background: #16a34a;
    }

    .btn-green:hover {
      background: #15803d;
    }

    .btn-red {
      background: #dc2626;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .info-box {
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .retailer-info {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-item {
      background: #f8fafc;
      padding: 15px;
      border-radius: 10px;
    }

    .info-item small {
      color: #64748b;
    }

    .info-item strong {
      display: block;
      margin-top: 5px;
      color: #1e293b;
      word-break: break-word;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f1f5f9;
      color: #334155;
    }

    .status {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .completed {
      background: #dcfce7;
      color: #166534;
    }

    .rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .processing {
      background: #dbeafe;
      color: #1e40af;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }

    @media (max-width: 800px) {
      .retailer-info {
        grid-template-columns: repeat(2, 1fr);
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .logout-btn {
        width: 100%;
      }
    }

    @media (max-width: 500px) {
      .retailer-info {
        grid-template-columns: 1fr;
      }

      body {
        padding: 10px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="brand">
      <h1>RAJKUMAR RATIONCARD SERVICES</h1>
      <p>Retailer Portal</p>
    </div>

    <button
      type="button"
      id="logoutBtn"
      class="logout-btn"
      onclick="logoutRetailer()">
      Logout
    </button>
  </div>


  <!-- LOGIN -->
  <div id="loginSection" class="card login-card">

    <h2>🔐 Retailer Login</h2>

    <div id="loginMessage" class="message"></div>

    <form id="loginForm">

      <div class="form-group">
        <label>Retailer ID / Username</label>

        <input
          type="text"
          id="loginUsername"
          autocomplete="username"
          required
          placeholder="RT001 અથવા Username">
      </div>


      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
          required
          placeholder="Password">
      </div>


      <button
        type="submit"
        id="loginBtn"
        class="btn">
        LOGIN
      </button>

    </form>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboardSection" class="hidden">

    <div class="card">

      <h2>👤 Retailer Dashboard</h2>

      <div id="dashboardMessage" class="message"></div>

      <div class="retailer-info">

        <div class="info-item">
          <small>Retailer ID</small>
          <strong id="showRetailerId">-</strong>
        </div>

        <div class="info-item">
          <small>Retailer Name</small>
          <strong id="showRetailerName">-</strong>
        </div>

        <div class="info-item">
          <small>Mobile</small>
          <strong id="showMobile">-</strong>
        </div>

        <div class="info-item">
          <small>Email</small>
          <strong id="showEmail">-</strong>
        </div>

      </div>

      <button
        type="button"
        class="btn btn-green"
        onclick="loadRetailerApplications()">
        🔄 Refresh Applications
      </button>

    </div>


    <!-- APPLICATIONS -->
    <div class="card">

      <h2>📋 My Applications</h2>

      <div id="applicationsLoading" class="loading hidden">
        Applications loading...
      </div>

      <div id="noApplications" class="info-box hidden">
        હજુ કોઈ application મળી નથી.
      </div>

      <div class="table-wrap">

        <table id="applicationsTable">

          <thead>
            <tr>
              <th>Application ID</th>
              <th>Date</th>
              <th>Applicant Name</th>
              <th>Service</th>
              <th>Amount</th>
              <th>Payment</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="applicationsBody">
          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<script src="retailer.js"></script>

</body>
</html>
