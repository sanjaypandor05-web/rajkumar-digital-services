<!DOCTYPE html>
<html lang="gu">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Retailer Dashboard - Rajkumar Rationcard Services</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="retailer.css">

</head>


<body>

<div class="retailer-page">


    <!-- =========================================
         TOP BAR
    ========================================== -->

    <header class="retailer-topbar">

        <div class="retailer-brand">
            👑 RAJKUMAR RATIONCARD SERVICES
        </div>

        <div class="retailer-phone">
            📞 9429193125
        </div>

    </header>


    <!-- =========================================
         DASHBOARD
    ========================================== -->

    <main class="dashboard">


        <!-- =====================================
             DASHBOARD HEADER
        ====================================== -->

        <section class="dashboard-header">

            <div>

                <h1>
                    👤 Retailer Dashboard
                </h1>

                <p>
                    Welcome,
                    <strong id="loggedRetailerName">
                        Retailer
                    </strong>
                </p>

                <p>
                    Retailer ID:
                    <strong id="loggedRetailerId">
                        -
                    </strong>
                </p>

            </div>


            <button
                type="button"
                class="logout-button"
                onclick="retailerLogout()">

                🚪 Logout

            </button>

        </section>



        <!-- =====================================
             RETAILER INFORMATION
        ====================================== -->

        <section class="services-box">

            <h2>
                👤 Retailer Information
            </h2>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Retailer Name
                    </label>

                    <input
                        type="text"
                        id="retailerNameDisplay"
                        readonly>

                </div>


                <div class="form-group">

                    <label>
                        Retailer ID
                    </label>

                    <input
                        type="text"
                        id="retailerIdDisplay"
                        readonly>

                </div>


                <div class="form-group">

                    <label>
                        Mobile
                    </label>

                    <input
                        type="text"
                        id="retailerMobileDisplay"
                        readonly>

                </div>


                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        id="retailerUsernameDisplay"
                        readonly>

                </div>

            </div>

        </section>



        <!-- =====================================
             SERVICES
        ====================================== -->

        <section class="services-box">

            <h2>
                📋 Select Service
            </h2>


            <div class="form-group">

                <label for="serviceSelect">
                    Service
                </label>


                <select
                    id="serviceSelect"
                    class="service-select">

                    <option value="">
                        -- Select Service --
                    </option>

                    <option
                        value="ADD_WITH_RC"
                        data-amount="150">

                        Name Add with RATIONCARD - ₹150

                    </option>

                    <option
                        value="ADD_WITHOUT_RC"
                        data-amount="350">

                        Name Add without RATIONCARD - ₹350

                    </option>

                    <option
                        value="REMOVE_WITH_RC"
                        data-amount="150">

                        Name Remove with RATIONCARD - ₹150

                    </option>

                    <option
                        value="REMOVE_WITHOUT_RC"
                        data-amount="350">

                        Name Remove without RATIONCARD - ₹350

                    </option>

                    <option
                        value="CORRECTION_WITH_RC"
                        data-amount="500">

                        RATIONCARD Correction - ₹500

                    </option>

                    <option
                        value="CORRECTION_WITHOUT_RC"
                        data-amount="700">

                        RATIONCARD Correction without RATIONCARD - ₹700

                    </option>

                    <option
                        value="ADD_HUSBAND_WITH_RC"
                        data-amount="500">

                        પિતાના નામવાળા Aadhaarથી પતિના Rationcardમાં નામ - ₹500

                    </option>

                    <option
                        value="ADD_HUSBAND_WITHOUT_RC"
                        data-amount="800">

                        પિતાના નામવાળા Aadhaarથી Rationcard વગર નામ - ₹800

                    </option>

                </select>

            </div>


            <div class="amount-box">

                <span class="amount-label">
                    Service Amount
                </span>

                <span class="amount-value">
                    ₹<span id="serviceAmount">0</span>
                </span>

            </div>

        </section>



        <!-- =====================================
             APPLICATION FORM
        ====================================== -->

        <section class="application-box">

            <h2>
                📝 New Application
            </h2>


            <form id="applicationForm">


                <div class="form-grid">


                    <!-- Aadhaar Name -->

                    <div class="form-group">

                        <label>
                            Aadhaar Name *
                        </label>

                        <input
                            type="text"
                            name="aadhaarName"
                            id="aadhaarName"
                            required>

                    </div>


                    <!-- English Name -->

                    <div class="form-group">

                        <label>
                            English Name
                        </label>

                        <input
                            type="text"
                            name="englishName"
                            id="englishName">

                    </div>


                    <!-- Gujarati Name -->

                    <div class="form-group">

                        <label>
                            Gujarati Name
                        </label>

                        <input
                            type="text"
                            name="gujaratiName"
                            id="gujaratiName">

                    </div>


                    <!-- Ration Card -->

                    <div class="form-group">

                        <label>
                            RATIONCARD Number
                        </label>

                        <input
                            type="text"
                            name="rationCardNo"
                            id="rationCardNo">

                    </div>


                    <!-- Gender -->

                    <div class="form-group">

                        <label>
                            Gender *
                        </label>

                        <select
                            name="gender"
                            id="gender"
                            required>

                            <option value="">
                                -- Select Gender --
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Village -->

                    <div class="form-group">

                        <label>
                            Village *
                        </label>

                        <input
                            type="text"
                            name="village"
                            id="village"
                            required>

                    </div>


                    <!-- Taluka -->

                    <div class="form-group">

                        <label>
                            Taluka *
                        </label>

                        <input
                            type="text"
                            name="taluka"
                            id="taluka"
                            required>

                    </div>


                    <!-- District -->

                    <div class="form-group">

                        <label>
                            District *
                        </label>

                        <input
                            type="text"
                            name="district"
                            id="district"
                            required>

                    </div>


                    <!-- Pincode -->

                    <div class="form-group">

                        <label>
                            Pincode *
                        </label>

                        <input
                            type="text"
                            name="pincode"
                            id="pincode"
                            maxlength="6"
                            required>

                    </div>


                    <!-- Mobile -->

                    <div class="form-group">

                        <label>
                            Mobile *
                        </label>

                        <input
                            type="tel"
                            name="mobile"
                            id="mobile"
                            maxlength="10"
                            required>

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            id="email">

                    </div>


                    <!-- Birth Date -->

                    <div class="form-group">

                        <label>
                            Birth Date
                        </label>

                        <input
                            type="date"
                            name="birthDate"
                            id="birthDate">

                    </div>


                    <!-- Birth Year -->

                    <div class="form-group">

                        <label>
                            Birth Year
                        </label>

                        <input
                            type="number"
                            name="birthYear"
                            id="birthYear"
                            min="1900"
                            max="2100">

                    </div>


                    <!-- Rationcard Status -->

                    <div class="form-group">

                        <label>
                            RATIONCARD Status
                        </label>

                        <select
                            name="rationcardStatus"
                            id="rationcardStatus">

                            <option value="">
                                -- Select --
                            </option>

                            <option value="Available">
                                Available
                            </option>

                            <option value="Not Available">
                                Not Available
                            </option>

                        </select>

                    </div>


                    <!-- UTR -->

                    <div class="form-group">

                        <label>
                            UTR Number *
                        </label>

                        <input
                            type="text"
                            name="utrNumber"
                            id="utrNumber"
                            required>

                    </div>

                </div>


                <!-- Payment Amount -->

                <div class="amount-box">

                    <span class="amount-label">
                        Payment Amount
                    </span>

                    <span class="amount-value">

                        ₹<span id="paymentAmount">
                            0
                        </span>

                    </span>

                </div>


                <!-- Message -->

                <div
                    id="applicationMessage"
                    style="
                        display:none;
                        margin-top:20px;
                        padding:15px;
                        border-radius:10px;
                    ">
                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="login-button">

                    📝 Submit Application

                </button>


            </form>

        </section>


    </main>

</div>


<script src="retailer.js"></script>

</body>

</html>
