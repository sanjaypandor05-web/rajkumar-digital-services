<!DOCTYPE html>
<html lang="gu">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex">

    <title>Retailer Login - Rajkumar Rationcard Services</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="retailer.css">

</head>


<body>


<!-- =====================================================
     RETAILER PAGE
===================================================== -->

<div class="retailer-page">


    <!-- =================================================
         TOP BAR
    ================================================== -->

    <header class="retailer-topbar">

        <div class="retailer-brand">
            RAJKUMAR RATIONCARD SERVICES
        </div>

        <div class="retailer-phone">
            Retailer Portal
        </div>

    </header>



    <!-- =================================================
         LOGIN SECTION
    ================================================== -->

    <section id="loginSection">

        <div class="login-wrapper">

            <div class="login-card">


                <!-- ICON -->

                <div class="login-icon">
                    👤
                </div>


                <!-- TITLE -->

                <h1>
                    RETAILER LOGIN
                </h1>


                <p>
                    Enter your Retailer ID and Password
                </p>


                <!-- LOGIN FORM -->

                <form id="retailerLoginForm"
                      autocomplete="off">


                    <!-- RETAILER ID -->

                    <div class="form-group">

                        <label for="retailerId">
                            Retailer ID
                        </label>

                        <input
                            type="text"
                            id="retailerId"
                            name="retailerId"
                            placeholder="Enter Retailer ID"
                            autocomplete="off"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="retailerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="retailerPassword"
                            name="retailerPassword"
                            placeholder="Enter Password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-button">

                        LOGIN

                    </button>


                    <!-- LOGIN MESSAGE -->

                    <div
                        id="loginMessage"
                        class="login-message"
                        style="display:none;">
                    </div>


                </form>


                <!-- BACK HOME ONLY -->

                <a
                    href="index.html"
                    class="back-home">

                    ← Back to Home

                </a>


            </div>

        </div>

    </section>



    <!-- =================================================
         RETAILER DASHBOARD SECTION
         Initially Hidden
    ================================================== -->

    <section
        id="dashboardSection"
        style="display:none;">


        <div class="dashboard">


            <!-- DASHBOARD HEADER -->

            <div class="dashboard-header">

                <div>

                    <h1>
                        Retailer Dashboard
                    </h1>

                    <p>
                        Welcome,
                        <strong id="loggedRetailerName">
                            Retailer
                        </strong>
                    </p>

                </div>


                <button
                    type="button"
                    class="logout-button"
                    onclick="retailerLogout()">

                    Logout

                </button>

            </div>



            <!-- =================================================
                 SERVICES
            ================================================== -->

            <div class="services-box">

                <h2>
                    Select Service
                </h2>


                <select
                    id="serviceSelect"
                    class="service-select">

                    <option value="">
                        -- Select Service --
                    </option>

                    <option
                        value="ADD_WITH_RC"
                        data-amount="150">

                        Name Add with RATIONCARD - ₹150

                    </option>

                    <option
                        value="ADD_WITHOUT_RC"
                        data-amount="350">

                        Name Add without RATIONCARD - ₹350

                    </option>

                    <option
                        value="REMOVE_WITH_RC"
                        data-amount="150">

                        Name Remove with RATIONCARD - ₹150

                    </option>

                    <option
                        value="REMOVE_WITHOUT_RC"
                        data-amount="350">

                        Name Remove without RATIONCARD - ₹350

                    </option>

                    <option
                        value="CORRECTION_WITH_RC"
                        data-amount="500">

                        RATIONCARD Correction - ₹500

                    </option>

                    <option
                        value="CORRECTION_WITHOUT_RC"
                        data-amount="700">

                        RATIONCARD Correction without RATIONCARD - ₹700

                    </option>

                    <option
                        value="ADD_HUSBAND_WITH_RC"
                        data-amount="500">

                        પિતાના નામવાળા Aadhaarથી પતિના Rationcardમાં નામ - ₹500

                    </option>

                    <option
                        value="ADD_HUSBAND_WITHOUT_RC"
                        data-amount="800">

                        પિતાના નામવાળા Aadhaarથી Rationcard વગર નામ - ₹800

                    </option>

                </select>


                <!-- AMOUNT -->

                <div class="amount-box">

                    <span class="amount-label">
                        Service Amount
                    </span>

                    <span class="amount-value">

                        ₹<span id="serviceAmount">0</span>

                    </span>

                </div>

            </div>



            <!-- =================================================
                 APPLICATION FORM
            ================================================== -->

            <div class="application-box">

                <h2>
                    Application Form
                </h2>


                <form id="applicationForm">


                    <div class="form-grid">


                        <!-- AADHAAR NAME -->

                        <div class="form-group">

                            <label>
                                Aadhaar Name *
                            </label>

                            <input
                                type="text"
                                name="aadhaarName"
                                id="aadhaarName"
                                required
                            >

                        </div>


                        <!-- ENGLISH NAME -->

                        <div class="form-group">

                            <label>
                                English Name
                            </label>

                            <input
                                type="text"
                                name="englishName"
                                id="englishName"
                            >

                        </div>


                        <!-- GUJARATI NAME -->

                        <div class="form-group">

                            <label>
                                Gujarati Name
                            </label>

                            <input
                                type="text"
                                name="gujaratiName"
                                id="gujaratiName"
                            >

                        </div>


                        <!-- RATION CARD -->

                        <div class="form-group">

                            <label>
                                RATIONCARD Number
                            </label>

                            <input
                                type="text"
                                name="rationCardNo"
                                id="rationCardNo"
                            >

                        </div>


                        <!-- GENDER -->

                        <div class="form-group">

                            <label>
                                Gender *
                            </label>

                            <select
                                name="gender"
                                id="gender"
                                required>

                                <option value="">
                                    -- Select Gender --
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- VILLAGE -->

                        <div class="form-group">

                            <label>
                                Village *
                            </label>

                            <input
                                type="text"
                                name="village"
                                id="village"
                                required
                            >

                        </div>


                        <!-- TALUKA -->

                        <div class="form-group">

                            <label>
                                Taluka *
                            </label>

                            <input
                                type="text"
                                name="taluka"
                                id="taluka"
                                required
                            >

                        </div>


                        <!-- DISTRICT -->

                        <div class="form-group">

                            <label>
                                District *
                            </label>

                            <input
                                type="text"
                                name="district"
                                id="district"
                                required
                            >

                        </div>


                        <!-- PINCODE -->

                        <div class="form-group">

                            <label>
                                Pincode *
                            </label>

                            <input
                                type="text"
                                name="pincode"
                                id="pincode"
                                maxlength="6"
                                required
                            >

                        </div>


                        <!-- MOBILE -->

                        <div class="form-group">

                            <label>
                                Mobile *
                            </label>

                            <input
                                type="tel"
                                name="mobile"
                                id="mobile"
                                maxlength="10"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="form-group">

                            <label>
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                id="email"
                            >

                        </div>


                        <!-- BIRTH DATE -->

                        <div class="form-group">

                            <label>
                                Birth Date
                            </label>

                            <input
                                type="date"
                                name="birthDate"
                                id="birthDate"
                            >

                        </div>


                        <!-- BIRTH YEAR -->

                        <div class="form-group">

                            <label>
                                Birth Year
                            </label>

                            <input
                                type="number"
                                name="birthYear"
                                id="birthYear"
                                min="1900"
                                max="2100"
                            >

                        </div>


                        <!-- RATION CARD STATUS -->

                        <div class="form-group">

                            <label>
                                RATIONCARD Status
                            </label>

                            <select
                                name="rationcardStatus"
                                id="rationcardStatus">

                                <option value="">
                                    -- Select Status --
                                </option>

                                <option value="Available">
                                    Available
                                </option>

                                <option value="Not Available">
                                    Not Available
                                </option>

                            </select>

                        </div>


                        <!-- UTR -->

                        <div class="form-group">

                            <label>
                                UTR Number *
                            </label>

                            <input
                                type="text"
                                name="utrNumber"
                                id="utrNumber"
                                required
                            >

                        </div>


                    </div>


                    <!-- PAYMENT AMOUNT -->

                    <div class="amount-box">

                        <span class="amount-label">
                            Payment Amount
                        </span>

                        <span class="amount-value">

                            ₹<span id="paymentAmount">0</span>

                        </span>

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="login-button">

                        Submit Application

                    </button>


                    <!-- APPLICATION MESSAGE -->

                    <div
                        id="applicationMessage"
                        style="display:none;
                               margin-top:15px;
                               padding:12px;
                               border-radius:10px;">
                    </div>


                </form>

            </div>


        </div>

    </section>


</div>



<!-- =====================================================
     RETAILER JAVASCRIPT
===================================================== -->

<script src="retailer.js"></script>


</body>

</html>
