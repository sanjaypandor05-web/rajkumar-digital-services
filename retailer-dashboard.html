<!DOCTYPE html>
<html lang="gu">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Retailer Login - Rajkumar Rationcard Services</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           RETAILER PAGE
        ========================================= */

        .retailer-page {
            min-height: 100vh;
            background: #f4f7fb;
        }


        .retailer-topbar {

            background: #062b65;
            color: white;

            padding: 15px 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }


        .retailer-brand {

            font-size: 19px;
            font-weight: 900;
        }


        .retailer-phone {

            font-size: 14px;
        }


        /* LOGIN */

        .login-wrapper {

            width: 92%;
            max-width: 450px;

            margin: 70px auto;

        }


        .login-card {

            background: white;

            padding: 35px 28px;

            border-radius: 22px;

            box-shadow:
                0 12px 35px rgba(0,0,0,0.12);

            text-align: center;
        }


        .login-icon {

            width: 75px;
            height: 75px;

            border-radius: 22px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            background: #e3f2fd;
        }


        .login-card h1 {

            color: #0d47a1;

            font-size: 25px;

            margin-bottom: 8px;
        }


        .login-card p {

            color: #777;

            margin-bottom: 25px;

            font-size: 14px;
        }


        .form-group {

            text-align: left;

            margin-bottom: 16px;
        }


        .form-group label {

            display: block;

            font-weight: bold;

            font-size: 14px;

            margin-bottom: 7px;

            color: #333;
        }


        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ccd5e0;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            background: white;
        }


        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            border-color: #1976d2;

            box-shadow:
                0 0 0 3px rgba(25,118,210,0.10);
        }


        .login-button {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #0d47a1,
                    #1976d2
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;
        }


        .back-home {

            display: block;

            margin-top: 20px;

            color: #0d47a1;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;
        }


        /* =========================================
           RETAILER DASHBOARD
        ========================================= */

        .dashboard {

            width: 94%;

            max-width: 1150px;

            margin: 30px auto 60px;
        }


        .dashboard-header {

            background: white;

            padding: 20px;

            border-radius: 18px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            box-shadow:
                0 7px 25px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }


        .dashboard-header h1 {

            color: #0d47a1;

            font-size: 25px;
        }


        .dashboard-header p {

            color: #777;

            margin-top: 5px;

            font-size: 14px;
        }


        .logout-button {

            border: none;

            background: #ffebee;

            color: #c62828;

            padding: 10px 16px;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;
        }


        /* SERVICES */

        .services-box {

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 7px 25px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }


        .services-box h2 {

            color: #0d47a1;

            margin-bottom: 18px;

            font-size: 21px;
        }


        .service-select {

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #ccd5e0;

            font-size: 15px;

            outline: none;
        }


        .amount-box {

            margin-top: 15px;

            padding: 15px;

            border-radius: 12px;

            background: #e8f5e9;

            border: 1px solid #c8e6c9;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .amount-label {

            font-weight: bold;

            color: #2e7d32;
        }


        .amount-value {

            font-size: 25px;

            font-weight: 900;

            color: #1b5e20;
        }


        /* APPLICATION FORM */

        .application-box {

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 7px 25px rgba(0,0,0,0.08);
        }


        .application-box h2 {

            color: #0d47a1;

            margin-bottom: 20px;

            font-size: 21px;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 16
