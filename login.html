<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rajkumar Login</title>

<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-page">

    <div class="login-container">

        <div class="login-header">
            <div class="login-logo">🌐</div>
            <h1>RAJKUMAR</h1>
            <p>Website Login</p>
        </div>


        <!-- LOGIN TYPE -->

        <div class="login-type-box">

            <button
                type="button"
                class="login-type-btn retailer-btn"
                id="retailerLoginBtn">

                👤
                <span>Retailer Login</span>

            </button>


            <button
                type="button"
                class="login-type-btn admin-btn"
                id="adminLoginBtn">

                👑
                <span>Admin Login</span>

            </button>

        </div>


        <!-- LOGIN FORM -->

        <div
            id="loginFormBox"
            class="login-form-box"
        >

            <div class="selected-icon" id="selectedLoginIcon">
                🔐
            </div>

            <h2 id="loginFormTitle">
                LOGIN
            </h2>

            <p id="loginFormSubtitle">
                Select login type
            </p>


            <form
                id="loginForm"
                autocomplete="off"
            >

                <input
                    type="hidden"
                    id="loginType"
                    value=""
                >


                <!-- USERNAME -->

                <div class="input-group">

                    <label for="username">
                        Username / Retailer ID
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter Username"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter Password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPasswordBtn"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="submitLoginBtn"
                    class="submit-login-btn"
                >
                    LOGIN
                </button>


                <!-- CLOSE -->

                <button
                    type="button"
                    id="closeLoginBtn"
                    class="close-login-btn"
                >
                    ← Back
                </button>

            </form>

        </div>


        <div class="back-home">
            <a href="index.html">
                ← Back to Home
            </a>
        </div>

    </div>

</div>


<script src="login.js"></script>

</body>
</html>
